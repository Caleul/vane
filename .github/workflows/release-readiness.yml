name: Release readiness

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_DB: vane_release
          POSTGRES_PASSWORD: vane-local-only
          POSTGRES_USER: vane
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vane -d vane_release"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VANE_RELEASE_DATABASE_URL: postgresql://vane:vane-local-only@127.0.0.1:5432/vane_release
      VANE_TEST_DATABASE_URL: postgresql://vane:vane-local-only@127.0.0.1:5432/vane_release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - name: Initialize release evidence outside checkout
        run: mkdir -p "$RUNNER_TEMP/vane-release/reports"
      - name: Install pinned dependencies
        run: npm ci 2>&1 | tee "$RUNNER_TEMP/vane-release/reports/npm-ci.log"
      - name: Framework checks
        run: npm run verify 2>&1 | tee "$RUNNER_TEMP/vane-release/reports/framework.log"
      - name: PostgreSQL integration
        run: npm run test:integration 2>&1 | tee "$RUNNER_TEMP/vane-release/reports/postgres.log"
      - name: Verify reviewed public API
        run: node scripts/release/api-snapshot.mjs 2>&1 | tee "$RUNNER_TEMP/vane-release/reports/api.log"
      - name: Release gate self-tests
        run: node --test scripts/release/*.test.mjs 2>&1 | tee "$RUNNER_TEMP/vane-release/reports/self-tests.log"
      - name: Pack identified clean RC outside checkout
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vane-release/reports"
          node scripts/release/pack.mjs \
            --out "$RUNNER_TEMP/vane-release" \
            --manifest "$RUNNER_TEMP/vane-release/package.json" \
            | tee "$RUNNER_TEMP/vane-release/reports/pack.log"
          VANE_RELEASE_TARBALL=$(node --input-type=module -e 'import {readFileSync} from "node:fs"; const manifest=JSON.parse(readFileSync(process.argv[1],"utf8")); console.log(manifest.path);' "$RUNNER_TEMP/vane-release/package.json")
          test -f "$VANE_RELEASE_TARBALL"
          echo "VANE_RELEASE_TARBALL=$VANE_RELEASE_TARBALL" >> "$GITHUB_ENV"
          VANE_RELEASE_VERSION=$(node --input-type=module -e 'import {readFileSync} from "node:fs"; console.log(JSON.parse(readFileSync(process.argv[1],"utf8")).packageVersion);' "$RUNNER_TEMP/vane-release/package.json")
          echo "VANE_RELEASE_VERSION=$VANE_RELEASE_VERSION" >> "$GITHUB_ENV"
      - name: Install archived independent consumers with the same RC
        id: consumers
        if: always() && steps.pack.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          VANE_RELEASE_CONSUMER_ARCHIVE=docs/evidence/phase9/consumers.tar.gz
          if [ ! -f "$VANE_RELEASE_CONSUMER_ARCHIVE" ]; then
            VANE_RELEASE_CONSUMER_ARCHIVE=docs/evidence/phase-8/consumers.tar.gz
          fi
          mkdir -p "$RUNNER_TEMP/vane-release/consumers"
          tar -xzf "$VANE_RELEASE_CONSUMER_ARCHIVE" -C "$RUNNER_TEMP/vane-release/consumers"
          VANE_RELEASE_CONSUMERS="$RUNNER_TEMP/vane-release/consumers/vane-dogfood/apps"
          for VANE_RELEASE_APP in todo commerce reservation; do
            test -f "$VANE_RELEASE_CONSUMERS/$VANE_RELEASE_APP/package.json"
            (
              cd "$VANE_RELEASE_CONSUMERS/$VANE_RELEASE_APP"
              npm ci --ignore-scripts
              npm install "$VANE_RELEASE_TARBALL" --ignore-scripts
            )
          done
          echo "VANE_RELEASE_CONSUMERS=$VANE_RELEASE_CONSUMERS" >> "$GITHUB_ENV"
          printf '%s\n' "$VANE_RELEASE_CONSUMER_ARCHIVE" > "$RUNNER_TEMP/vane-release/reports/consumer-archive.txt"
      - name: Audit actual packed bytes and consumer dependencies
        if: always() && steps.pack.outcome == 'success' && steps.consumers.outcome == 'success'
        run: >-
          node scripts/release/audit.mjs
          --tarball "$VANE_RELEASE_TARBALL"
          --consumer "$VANE_RELEASE_CONSUMERS/todo"
          --consumer "$VANE_RELEASE_CONSUMERS/commerce"
          --consumer "$VANE_RELEASE_CONSUMERS/reservation"
          --output "$RUNNER_TEMP/vane-release/reports/supply-chain.json"
          2>&1 | tee "$RUNNER_TEMP/vane-release/reports/supply-chain.log"
      - name: Upgrade PostgreSQL consumer from archived baseline to this RC
        if: always() && steps.pack.outcome == 'success'
        run: >-
          node scripts/release/upgrade.mjs
          --tarball "$VANE_RELEASE_TARBALL"
          --expected-version "$VANE_RELEASE_VERSION"
          --out "$RUNNER_TEMP/vane-release/reports/upgrade.json"
          2>&1 | tee "$RUNNER_TEMP/vane-release/reports/upgrade.log"
      - name: Reproduce canonical bytes across clean clones and umasks
        if: always() && steps.pack.outcome == 'success'
        run: >-
          node scripts/release/reproducibility.mjs
          --out "$RUNNER_TEMP/vane-release/reproducibility"
          2>&1 | tee "$RUNNER_TEMP/vane-release/reports/reproducibility.log"
      - name: Preserve package identity and release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/vane-release/*.tgz
            ${{ runner.temp }}/vane-release/package.json
            ${{ runner.temp }}/vane-release/reports/
            ${{ runner.temp }}/vane-release/reproducibility/
          if-no-files-found: warn
