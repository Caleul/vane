name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run verify

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_DB: vane
          POSTGRES_PASSWORD: vane
          POSTGRES_USER: vane
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vane -d vane"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VANE_TEST_DATABASE_URL: postgresql://vane:vane@localhost:5432/vane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  conformance:
    timeout-minutes: 15
    # This is a real candidate gate: required FAIL and GAP both fail the job.
    # A green regression suite does not imply full normative conformance.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_DB: vane_conformance
          POSTGRES_PASSWORD: vane
          POSTGRES_USER: vane
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vane -d vane_conformance"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VANE_CONFORMANCE_DATABASE_URL: postgresql://vane:vane@localhost:5432/vane_conformance
      VANE_CONFORMANCE_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run test:conformance
      - id: candidate
        run: |
          node scripts/release/pack.mjs --out /tmp/release-candidate --manifest /tmp/release-candidate/manifest.json
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const manifest = JSON.parse(readFileSync('/tmp/release-candidate/manifest.json', 'utf8'));
          if (typeof manifest.path !== 'string' || /[\r\n]/.test(manifest.path)) throw new Error('Invalid candidate path');
          const hash = createHash('sha256').update(readFileSync(manifest.path)).digest('hex');
          if (hash !== manifest.sha256) throw new Error('Candidate manifest integrity mismatch');
          appendFileSync(process.env.GITHUB_OUTPUT, `tarball=${manifest.path}\n`);
          NODE
      - run: node conformance/pack-and-run.mjs --tarball "${{ steps.candidate.outputs.tarball }}" --sanity
      - name: Run independent candidate conformance gate
        run: node conformance/pack-and-run.mjs --tarball "${{ steps.candidate.outputs.tarball }}" --out /tmp/conformance-report.json
      - name: Preserve candidate evidence even when blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entity-event-conformance-${{ github.sha }}
          path: /tmp/conformance-report.json
          if-no-files-found: warn
